<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sorteie o amigo secreto da sua turma de forma rápida, justa e divertida.">
    <meta name="theme-color" content="#4B69FD">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Merriweather:ital,wght@1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Amigo Secreto</title>
</head>

<body>
    <button id="btnTema" class="theme-toggle" onclick="alternarTema()" aria-label="Alternar tema claro/escuro">🌙</button>

    <main class="main-content">
        <header class="header-banner">
            <h1 class="main-title">Amigo Secreto</h1>
            <span class="header-emoji" aria-hidden="true">🎁</span>
        </header>

        <section class="input-section">
            <h2 class="section-title">Digite o nome dos seus amigos</h2>
            <div class="input-wrapper">
                <label for="amigo" class="sr-only">Nome do amigo</label>
                <input type="text" id="amigo" class="input-name" placeholder="Digite um nome" maxlength="40" autocomplete="off">
                <button class="button-add" onclick="adicionarAmigo()">Adicionar</button>
            </div>

            <p id="mensagem" class="message" role="alert"></p>

            <div class="list-header">
                <span id="contador" class="counter"></span>
                <button id="btnLimpar" class="button-link" onclick="limparLista()" hidden>Limpar lista</button>
            </div>
            <ul id="listaAmigos" class="name-list" aria-label="Participantes"></ul>

            <ul id="resultado" class="result-list" aria-live="polite"></ul>

            <div id="acoesResultado" class="result-actions" hidden>
                <button class="button-secondary" onclick="copiarResultado()">📋 Copiar resultado</button>
                <button class="button-secondary" onclick="abrirMensagens()">💬 Enviar por WhatsApp</button>
            </div>

            <div class="button-container">
                <button class="button-draw" onclick="sortearAmigo()">🎲 Sortear um amigo</button>
                <button id="btnSortearPares" class="button-draw button-draw--alt" onclick="sortearPares()" disabled>🔄 Sortear todos os pares</button>
            </div>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
